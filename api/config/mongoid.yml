development:
  clients:
    default:
      uri: <%= ENV.fetch('MONGODB_URI', 'mongodb://localhost:27017/smart_reviewer_dev') %>
      options:
        server_selection_timeout: 5
  options:
    raise_not_found_error: false

test:
  clients:
    default:
      uri: <%= ENV.fetch('MONGODB_URI', 'mongodb://localhost:27017/smart_reviewer_test') %>
      options:
        server_selection_timeout: 5
        max_pool_size: 1
        read:
          mode: :primary
  options:
    raise_not_found_error: false

production:
  clients:
    default:
      uri: <%= ENV['MONGODB_URI'] %>
      options:
        # Atlas M0 free tier idles when not used and can take 10-30s to wake up
        # on the next request. 5s is too aggressive and fails the first hit
        # after idle; 30s lets the driver retry shards through the cold start.
        server_selection_timeout: 30
  options:
    raise_not_found_error: false
